name: Release

# Builds and publishes the Windows and Mac programs when a version tag such as v1.0.0 is pushed.
on:
  push:
    tags:
      - "v*"

# Read only by default; only the job that publishes the release may write.
permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run the tests
        run: |
          cargo test --locked --release -p netspeedgauge-shared
          cargo test --locked --release -p netspeedgauge-mac --test readout_tests

      # Signs with the release certificate when the secrets exist, from a keychain only this job uses.
      - name: Import the signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::warning::No signing certificate in the secrets; the app is signed ad hoc and cannot update itself."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "developedByAshu Code Signing" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          echo "MAC_SIGN_IDENTITY=developedByAshu Code Signing" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build the app
        run: SKIP_TESTS=1 ./mac/bundle.sh

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"

      - name: Zip the app
        run: ditto -c -k --keepParent target/mac/NetSpeedGauge.app NetSpeedGauge-mac-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-program
          path: NetSpeedGauge-mac-arm64.zip

  release:
    needs: mac
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-program
          path: dist

      - name: Add the ARM target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Run the tests
        run: cargo test --locked --release -p netspeedgauge-shared -p netspeedgauge-windows

      - name: Build for x64
        run: cargo build --locked --release -p netspeedgauge-windows --bin NetSpeedGauge

      - name: Build for ARM64
        run: cargo build --locked --release -p netspeedgauge-windows --bin NetSpeedGauge --target aarch64-pc-windows-msvc

      # The updater trusts SHA256SUMS.txt only with signatures/<tag>.sig on main, signed offline with the release key.
      - name: Collect the programs and their checksums
        shell: pwsh
        run: |
          Copy-Item target\release\NetSpeedGauge.exe dist\NetSpeedGauge-x64.exe
          Copy-Item target\aarch64-pc-windows-msvc\release\NetSpeedGauge.exe dist\NetSpeedGauge-arm64.exe
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist\NetSpeedGauge-x64.exe dist\NetSpeedGauge-arm64.exe dist\NetSpeedGauge-mac-arm64.zip dist\SHA256SUMS.txt `
            --title "NetSpeedGauge $env:GITHUB_REF_NAME" --notes-file docs\release-notes\$env:GITHUB_REF_NAME.md
